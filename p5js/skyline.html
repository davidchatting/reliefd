<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRTM Skyline Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: monospace;
      color: #fff;
    }

    #stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #stage svg {
      max-width: 92vw;
      max-height: 88vh;
    }

    .ring {
      fill: none;
      stroke: #444;
      stroke-width: 1;
      stroke-dasharray: 2 3;
    }

    .skyline {
      fill: none;
      stroke: #fff;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .start {
      fill: #9a8f63;
      stroke: #111;
      stroke-width: 1;
    }

    .centre {
      fill: #000;
      stroke: #fff;
      stroke-width: 1;
    }

    .compass {
      font-family: monospace;
      font-size: 13px;
      fill: #999;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    .radius-label {
      font-family: monospace;
      font-size: 11px;
      fill: #777;
      text-anchor: middle;
      dominant-baseline: middle;
    }

    #panel {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #444;
      border-radius: 4px;
      padding: 10px;
      font-size: 12px;
    }

    #panel label {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    #panel input {
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #444;
      color: #fff;
      font-family: monospace;
      font-size: 12px;
      padding: 4px 6px;
      border-radius: 4px;
      width: 110px;
    }

    #panel button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid #444;
      color: #fff;
      font-family: monospace;
      font-size: 12px;
      padding: 6px 8px;
      border-radius: 4px;
      cursor: pointer;
    }

    #panel button:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    #info {
      position: fixed;
      bottom: 12px;
      left: 12px;
      display: flex;
      gap: 16px;
      color: #fff;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.5);
      padding: 6px 10px;
      border-radius: 4px;
      pointer-events: none;
    }

    #status {
      position: fixed;
      bottom: 12px;
      right: 12px;
      color: #999;
      font-size: 12px;
      background: rgba(0, 0, 0, 0.5);
      padding: 6px 10px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <main id="stage"></main>

  <form id="panel" onsubmit="goToLocation(event)">
    <label>Latitude
      <input id="lat-input" type="number" step="any" required>
    </label>
    <label>Longitude
      <input id="lon-input" type="number" step="any" required>
    </label>
    <label>Radii (km)
      <input id="radius-input" type="text" placeholder="5, 10, 15" required>
    </label>
    <label>Bearings
      <input id="directions-input" type="number" step="1" min="8" max="720" required>
    </label>
    <button type="submit">Go / Apply</button>
  </form>

  <div id="info">
    <span id="centre-info"></span>
    <span id="radius-info"></span>
    <span id="bearings-info"></span>
  </div>

  <div id="status"></div>

  <script src="skyline.js"></script>
</body>
</html>
